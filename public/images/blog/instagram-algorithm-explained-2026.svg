<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8A2387"/>
      <stop offset="50%" stop-color="#E94057"/>
      <stop offset="100%" stop-color="#F27121"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.18)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.06)"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="rgba(0,0,0,0.3)"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Decorative circles / shapes -->
  <circle cx="1050" cy="120" r="240" fill="rgba(255,255,255,0.08)"/>
  <circle cx="150" cy="520" r="180" fill="rgba(0,0,0,0.12)"/>
  <circle cx="980" cy="520" r="90" fill="rgba(255,255,255,0.05)"/>

  <!-- Glass Card -->
  <rect x="80" y="70" width="1040" height="490" rx="24" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Brand watermark -->
  <text x="140" y="140" fill="rgba(255,255,255,0.95)" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" letter-spacing="2">INSTAPSV EDITORIAL</text>

  <!-- Category pill -->
  <rect x="140" y="170" width="160" height="38" rx="19" fill="rgba(255,255,255,0.22)"/>
  <text x="220" y="195" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" text-anchor="middle">GUIDES</text>

  <!-- Article Title (Auto multi-line simulation) -->
  <text x="140" y="275" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
    Instagram Algorithm Explained 2026: Feed & Reels
  </text>

  <!-- Subtitle -->
  <text x="140" y="340" fill="rgba(255,255,255,0.85)" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="400">
    Comprehensive Guide &amp; Research Analysis &bull; Updated 2026
  </text>

  <!-- Icon Circle -->
  <g transform="translate(940, 260)">
    <circle cx="60" cy="60" r="70" fill="rgba(255,255,255,0.18)" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
    <g transform="translate(30, 30) scale(2.5)">
      <path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z" fill="#ffffff"/>
    </g>
  </g>

  <!-- Footer meta in card -->
  <line x1="140" y1="470" x2="1060" y2="470" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="140" y="515" fill="rgba(255,255,255,0.9)" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600">InstaPSV Research Hub</text>
  <text x="1060" y="515" fill="rgba(255,255,255,0.7)" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" text-anchor="end">instapsv.com</text>
</svg>